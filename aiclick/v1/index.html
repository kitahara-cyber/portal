<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>アイクリック様 専用ポータル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Shippori+Mincho+B1:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
/* Layout: 参考（SECOND）に合わせ、暗い表紙 → 生成りの本文。本文は左カラム、右にスクロールに合わせて話す「担当ナビ」を固定。
   スマホではナビは画面下の吹き出しになる。 */
:root{
  --bg:#f4f2ec; --surface:#fbfaf6; --ink:#15171b; --tx:#2d3036; --mute:#6c6f76; --faint:#9a9ca1;
  --line:#dedad0; --line2:#ebe8e0;
  --accent:#d9481f; --accent-ink:#b23a17; --accent-soft:#fbe7de;
  --good:#1f7a55; --good-soft:#e2f1ea;
  --hero:#16181c; --hero-tx:#f4f2ec; --hero-mute:#a7a59f;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141518; --surface:#1c1e22; --ink:#f1efe9; --tx:#d9d7d1; --mute:#9a9ca1; --faint:#71747a;
  --line:#2e3036; --line2:#24262b; --accent:#f06a3e; --accent-ink:#ff8a62; --accent-soft:#3a2219;
  --good:#4fbf8d; --good-soft:#18302a; --hero:#0c0d0f; --hero-tx:#f1efe9; --hero-mute:#9a9893; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --surface:#1c1e22; --ink:#f1efe9; --tx:#d9d7d1; --mute:#9a9ca1; --faint:#71747a;
  --line:#2e3036; --line2:#24262b; --accent:#f06a3e; --accent-ink:#ff8a62; --accent-soft:#3a2219;
  --good:#4fbf8d; --good-soft:#18302a; --hero:#0c0d0f; --hero-tx:#f1efe9; --hero-mute:#9a9893; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.85;letter-spacing:.02em;font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
h1,h2,h3{color:var(--ink);text-wrap:balance;word-break:auto-phrase;margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--hero-tx);border-bottom:1px solid rgba(255,255,255,.08)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--hero)}
.bar .wrap{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.08em}
.brand small{font-family:var(--sans);color:var(--hero-mute);margin-left:10px;font-size:12px;letter-spacing:.04em}
.bar nav{margin-left:auto;display:flex;gap:18px;font-size:12.5px;overflow-x:auto;scrollbar-width:none}
.bar nav a{text-decoration:none;color:var(--hero-mute);white-space:nowrap}
.bar nav a:hover,.bar nav a.on{color:var(--hero-tx)}
@media (max-width:860px){.bar nav{display:none}}

/* hero */
.hero{background:var(--hero);color:var(--hero-tx);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-80px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(217,72,31,.28),transparent 65%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;padding-block:56px 52px;align-items:end}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:32px;padding-block:40px}}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.hero h1{color:var(--hero-tx);font-size:clamp(1.9rem,4.6vw,3.1rem);font-weight:900;line-height:1.3;letter-spacing:-.01em;margin:14px 0 18px}
.hero p.lead{color:var(--hero-mute);max-width:36em;font-size:14.5px}
.sample{display:inline-block;margin-top:16px;font-size:11.5px;color:var(--hero-mute);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 12px}
.next{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:20px 22px;display:grid;gap:10px}
.next .k{font-family:var(--mono);font-size:11.5px;color:var(--hero-mute)}
.next .when{font-size:22px;font-weight:900}
.next ul{margin:0;padding-left:1.1em;font-size:13.5px;color:var(--hero-mute);display:grid;gap:2px}
.next .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip-d{font-size:12px;border-radius:999px;padding:3px 12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
.chip-l{font-size:12px;border-radius:999px;padding:3px 12px;border:1px solid rgba(255,255,255,.25);color:var(--hero-tx);text-decoration:none}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;align-items:start}
@media (max-width:1020px){.layout{grid-template-columns:1fr}}
main{min-width:0}
section.s{padding-block:52px 8px;scroll-margin-top:64px}
.sh{display:grid;gap:6px;margin-bottom:24px}
.sh .no{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sh h2{font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:900;line-height:1.45}
.sh p{color:var(--mute);font-size:14px;max-width:40em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.cap{font-size:12px;color:var(--faint);margin-top:10px}

/* お知らせ */
.notice{display:grid;border-top:1px solid var(--line);margin-top:28px}
.notice a{display:grid;grid-template-columns:86px 74px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px;align-items:baseline}
.notice a:hover b{color:var(--accent-ink)}
.notice .d{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 8px;text-align:center;background:var(--line2);color:var(--mute);white-space:nowrap}
.tag.new{background:var(--accent-soft);color:var(--accent-ink)}
.notice b{font-weight:500;color:var(--ink)}
@media (max-width:560px){.notice a{grid-template-columns:auto auto;}.notice a b{grid-column:1/-1}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis>div{padding:18px 20px;display:grid;gap:2px;border-left:1px solid var(--line)}
.kpis>div:first-child{border-left:0}
.kpis .l{font-size:12px;color:var(--mute);font-weight:700}
.kpis .v{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ink);line-height:1.2}
.kpis .v small{font-size:13px;color:var(--mute);margin-left:2px}
.kpis .c{font-size:12px;color:var(--mute)}
.up{color:var(--good);font-weight:700}
@media (max-width:680px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>div:nth-child(3){border-left:0}.kpis>div:nth-child(n+3){border-top:1px solid var(--line)}}
.chart{padding:20px 22px;margin-top:16px}
.chart h3{font-size:14px;margin-bottom:14px}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:end;height:170px;border-bottom:1px solid var(--line);position:relative}
.bars .b{display:grid;align-content:end;gap:6px;height:100%;text-align:center}
.bars .b i{display:block;background:var(--line);border-radius:4px 4px 0 0}
.bars .b.cur i{background:var(--accent)}
.bars .b span{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.bars .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mute)}
.bars .avg em{position:absolute;right:0;top:-20px;font-style:normal;font-size:11px;color:var(--mute);background:var(--surface);padding:0 4px}
.bx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:6px}
.reports{display:grid;margin-top:16px}
.rp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);font-size:14px}
.rp:first-child{border-top:0}
.rp b{color:var(--ink);font-weight:700}
.rp small{display:block;color:var(--mute);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.p:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* 予測 */
.fc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:hidden}
.fc>div{padding:22px}
.fc .now{border-right:1px solid var(--line)}
.fc .fut{background:var(--accent-soft)}
.fc .k{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.fc .fut .k{color:var(--accent-ink)}
.fc .big{font-family:var(--mono);font-size:40px;font-weight:600;color:var(--ink);line-height:1.15}
.fc .fut .big{color:var(--accent-ink)}
.fc .big small{font-size:14px;margin-left:4px;color:var(--mute)}
.fc ul{margin:10px 0 0;padding-left:1.1em;font-size:13.5px;display:grid;gap:4px}
@media (max-width:640px){.fc{grid-template-columns:1fr}.fc .now{border-right:0;border-bottom:1px solid var(--line)}}

/* 打ち合わせログ */
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.mt{position:relative;padding:0 0 26px 26px}
.mt::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--faint)}
.mt.latest::before{background:var(--accent);border-color:var(--accent)}
.mt .d{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.mt h3{font-size:16px;margin:2px 0 10px}
.mt .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt .g>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;min-width:0}
.mt .g b{display:block;font-size:11.5px;color:var(--mute);letter-spacing:.06em;margin-bottom:4px}
.mt .g ul{margin:0;padding-left:1.1em}
.mt .out{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mt .out span{font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:2px 10px;color:var(--mute)}
.mt .out span.ok{border-style:solid;border-color:var(--good);color:var(--good);background:var(--good-soft)}
@media (max-width:620px){.mt .g{grid-template-columns:1fr}}

/* 提出物 */
.ph{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.ph{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.ph{grid-template-columns:1fr}}
.phc{padding:16px;display:grid;gap:10px;align-content:start}
.phc .n{font-family:var(--mono);font-size:12px;color:var(--accent)}
.phc h3{font-size:14.5px;line-height:1.5}
.dl{display:grid;gap:6px}
.dl div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;border-top:1px solid var(--line2);padding-top:6px}
.st{font-size:11px;font-weight:700;border-radius:4px;padding:0 7px;white-space:nowrap}
.st.done{background:var(--good-soft);color:var(--good)}
.st.live{background:var(--accent-soft);color:var(--accent-ink)}
.st.wait{background:var(--line2);color:var(--mute)}

/* 事例 */
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search input{flex:1 1 240px;min-width:0;font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{font-size:12.5px;border-radius:999px;padding:4px 12px;border:1px solid var(--line);background:transparent}
.fl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.cases{grid-template-columns:1fr}}
.case{padding:16px 18px;display:grid;gap:8px;align-content:start}
.case .meta{display:flex;gap:6px;flex-wrap:wrap}
.case h3{font-size:15px;line-height:1.5}
.case p{font-size:13.5px;color:var(--tx)}
.case .res{font-family:var(--mono);font-size:13px;color:var(--accent-ink);font-weight:600}
.empty{padding:20px;text-align:center;color:var(--mute);font-size:14px}

/* 情報 */
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.info{grid-template-columns:1fr}}
.ic{padding:16px 18px;display:grid;gap:8px;align-content:start}
.ic .k{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.ic h3{font-size:14.5px;line-height:1.55}
.ic p{font-size:13px;color:var(--mute)}

/* 特典 */
.perks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.perks{grid-template-columns:1fr}}
.pk{padding:20px;display:grid;gap:8px;align-content:start}
.pk.hot{background:var(--hero);color:var(--hero-tx);border-color:var(--hero)}
.pk.hot h3{color:var(--hero-tx)}
.pk.hot p{color:var(--hero-mute)}
.pk .k{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.pk h3{font-size:16px;line-height:1.5}
.pk p{font-size:13.5px;color:var(--mute)}
.pk .price{font-family:var(--mono);font-size:13px}
.pk .price s{opacity:.6;margin-right:8px}
.pk .price b{color:var(--accent);font-size:18px}

/* ナビ */
aside.navi{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);padding-top:52px}
.nv{padding:18px;display:grid;gap:12px}
.nv .who{display:flex;gap:12px;align-items:center}
.nv .who svg{flex:none;width:56px;height:56px}
.nv .who b{display:block;font-size:14px;color:var(--ink)}
.nv .who small{font-size:11.5px;color:var(--mute)}
.bubble{position:relative;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.75;transition:opacity .25s}
.bubble::before{content:"";position:absolute;left:22px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--accent-soft)}
.bubble.fade{opacity:.15}
.rel{display:grid;gap:6px}
.rel .h{font-size:11.5px;color:var(--mute);font-weight:700}
.rel a{font-size:13px;text-decoration:none;display:flex;gap:6px;align-items:baseline;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.rel a:hover{border-color:var(--accent);color:var(--accent-ink)}
.rel a::before{content:"→";color:var(--accent);font-family:var(--mono)}
.nv .fq{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.nv .fq b{color:var(--ink)}
@media (max-width:1020px){
  aside.navi{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:30;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
  .nv{pointer-events:auto;max-width:560px;margin-left:auto;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;gap:8px}
  .nv .who svg{width:40px;height:40px}
  .nv .rel,.nv .fq{display:none}
  .nv.open .rel{display:grid}
  .nv .tg{display:inline-flex}
  main{padding-bottom:180px}
}
.nv .tg{display:none;margin-left:auto;font-size:12px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px}

footer{border-top:1px solid var(--line);margin-top:56px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding-block:22px 40px;font-size:12px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 16px;border-radius:999px;z-index:40}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bubble{transition:none}}

:root[data-skin="night"]{--paper-glass:rgba(13,17,23,.9)}:root[data-skin="pencil"]{--paper-glass:rgba(251,250,245,.92)}:root[data-skin="pop"]{--paper-glass:rgba(255,255,255,.94)}
</style>
<style>

.prog{padding:18px 22px;display:grid;gap:10px;margin-top:16px}
.prog .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13.5px}
.prog .row b{color:var(--ink)}
.track{height:14px;border-radius:999px;background:var(--line2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
.mrow:first-of-type{border-top:0}
.mrow .m{font-family:var(--mono);color:var(--mute)}
.mrow .t{position:relative;height:12px;background:var(--line2);border-radius:3px}
.mrow .t i{position:absolute;inset:0 auto 0 0;background:var(--faint);border-radius:3px}
.mrow .t em{position:absolute;left:calc(var(--w) + 8px);top:-4px;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--mute)}
.mrow .a{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.mrow .a s{width:7px;height:7px;border-radius:50%;background:var(--accent);text-decoration:none}
.mrow .a span{font-family:var(--mono);font-weight:600;color:var(--ink);min-width:2ch;text-align:right}
.legend2{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:8px}
.legend2 span{display:inline-flex;gap:6px;align-items:center}
.legend2 i{width:12px;height:8px;border-radius:2px;background:var(--faint)}
.legend2 i.a{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:16px}
.pipe>div{padding:14px 16px;border-left:1px solid var(--line);display:grid;gap:2px}
.pipe>div:first-child{border-left:0}
.pipe .l{font-size:12px;color:var(--mute);font-weight:700}
.pipe .v{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
.pipe .v.hot{color:var(--accent-ink)}
@media (max-width:600px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe>div:nth-child(3){border-left:0}.pipe>div:nth-child(n+3){border-top:1px solid var(--line)}}
.apos{width:100%;border-collapse:collapse;font-size:13px}
.apos th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line)}
.apos td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.apos td.d{font-family:var(--mono);white-space:nowrap;color:var(--mute)}
.apos tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto;margin-top:16px}
.st.lose{background:var(--line2);color:var(--faint)}
.ng{padding:18px 22px;display:grid;gap:8px}
.ng h3{font-size:14px}
.nr{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 52px;gap:12px;align-items:center;font-size:13px}
.nr .t{height:10px;background:var(--line2);border-radius:3px;position:relative}
.nr .t i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;opacity:.8}
.nr .v{font-family:var(--mono);text-align:right;color:var(--ink)}

details.older{margin:0 0 20px 26px}
details.older summary{cursor:pointer;font-size:13px;color:var(--accent-ink);font-weight:700}
details.older ul{margin:10px 0 0;padding-left:1.1em;font-size:13.5px;display:grid;gap:6px}
details.older li b{font-family:var(--mono);font-weight:600;color:var(--mute);margin-right:8px}
.draft{background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;text-align:center;padding:6px 16px}

/* 定例資料（スライド） */
#deckwrap{--navi-w:300px;position:relative;overflow-y:auto;scroll-snap-type:y proximity;scroll-behavior:smooth;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.8;border-top:1px solid var(--line);overscroll-behavior:contain}
#deckwrap:fullscreen{height:100vh!important}
#deckwrap h1,#deckwrap h2,#deckwrap h3{color:var(--ink);text-wrap:balance;word-break:auto-phrase;margin:0}
#deckwrap p{margin:0}
#deckwrap .slide{min-height:100%!important}
@media (prefers-reduced-motion:reduce){#deckwrap{scroll-behavior:auto}}
#deckwrap .mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:0}
#deckwrap .slide{min-height:100vh;min-height:100dvh;scroll-snap-align:start;display:flex;align-items:center;border-bottom:1px solid var(--line)}
#deckwrap .inner{width:100%;max-width:calc(1180px);margin:0 auto;padding-block:56px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:calc(var(--navi-w) + 56px)}
@media (max-width:1020px){#deckwrap .inner{padding-right:max(20px,env(safe-area-inset-right,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-block:40px 200px}}
#deckwrap .sh{display:grid;gap:6px;margin-bottom:24px}
#deckwrap .sh .no{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
#deckwrap .sh h2{font-size:clamp(1.35rem,2.8vw,1.9rem);font-weight:900;line-height:1.45}
#deckwrap .sh p{color:var(--mute);font-size:14px;max-width:44em}
#deckwrap .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
#deckwrap .cap{font-size:12px;color:var(--faint);margin-top:10px}
#deckwrap em.hl{font-style:normal;color:var(--accent-ink)}
#deckwrap .cover{background:var(--hero);color:var(--hero-tx);position:relative;overflow:hidden;border-bottom:0}
#deckwrap .cover::after{content:"";position:absolute;right:-160px;top:-120px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(217,72,31,.3),transparent 65%);pointer-events:none}
#deckwrap .cover .inner{position:relative;z-index:1;display:grid;gap:18px}
#deckwrap .cover .eyebrow{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em}
#deckwrap .cover .client{font-size:15px;font-weight:700;color:var(--hero-mute)}
#deckwrap .cover h1{color:var(--hero-tx);font-size:clamp(2rem,5.4vw,3.6rem);font-weight:900;line-height:1.25;letter-spacing:-.01em}
#deckwrap .cover .meta{display:grid;gap:4px;font-size:13px;color:var(--hero-mute);border-top:1px solid rgba(255,255,255,.14);padding-top:16px;max-width:640px}
#deckwrap .cover .meta b{color:var(--hero-tx);font-weight:500;margin-left:8px}
#deckwrap .cover .start{justify-self:start;margin-top:10px;display:inline-flex;gap:10px;align-items:center;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-weight:700;text-decoration:none}
#deckwrap .cover .hint{font-size:12px;color:var(--hero-mute)}
#deckwrap .funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
#deckwrap .funnel>div{padding:18px 20px;display:grid;gap:2px;border-left:1px solid var(--line);position:relative}
#deckwrap .funnel>div:first-child{border-left:0}
#deckwrap .funnel .l{font-size:12px;color:var(--mute);font-weight:700}
#deckwrap .funnel .v{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--ink);line-height:1.15}
#deckwrap .funnel .r{font-size:12px;color:var(--mute)}
#deckwrap .funnel .zero .v{color:var(--accent-ink)}
@media (max-width:640px){#deckwrap .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
#deckwrap .funnel>div:nth-child(3){border-left:0}
#deckwrap .funnel>div:nth-child(n+3){border-top:1px solid var(--line)}}
#deckwrap .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:760px){#deckwrap .three{grid-template-columns:1fr}}
#deckwrap .three>div{padding:16px 18px;display:grid;gap:6px;align-content:start}
#deckwrap .three .k{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
#deckwrap .three p{font-size:13.5px}
#deckwrap .three ol{margin:0;padding-left:1.2em;font-size:13.5px;display:grid;gap:2px}
#deckwrap .hb{display:grid;gap:0;padding:12px 20px}
#deckwrap .hr{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:13.5px}
#deckwrap .hr:first-child{border-top:0}
#deckwrap .hr .t{height:14px;background:var(--line2);border-radius:3px;position:relative}
#deckwrap .hr .t i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--faint)}
#deckwrap .hr.key .t i{background:var(--accent)}
#deckwrap .hr .v{text-align:right;font-family:var(--mono);color:var(--ink)}
#deckwrap .hr .v small{color:var(--mute);margin-left:6px}
@media (max-width:520px){#deckwrap .hr{grid-template-columns:minmax(0,1fr) 84px}
#deckwrap .hr .t{grid-column:1/-1;grid-row:2}}
#deckwrap .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){#deckwrap .two{grid-template-columns:1fr}}
#deckwrap .two>.panel h3{font-size:14px;padding:16px 20px 0}
#deckwrap .note{font-size:13px;color:var(--mute);padding:0 20px 16px}
#deckwrap .bm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){#deckwrap .bm{grid-template-columns:1fr}}
#deckwrap .bmc{padding:18px 20px;display:grid;gap:12px;align-content:start}
#deckwrap .bmc h3{font-size:15px}
#deckwrap .scale{position:relative;height:56px;margin:4px 6px 0}
#deckwrap .scale .axis{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:3px;background:var(--line2)}
#deckwrap .scale .band{position:absolute;top:26px;height:6px;border-radius:3px;background:var(--faint);opacity:.55}
#deckwrap .scale .pt{position:absolute;top:18px;width:2px;height:22px;background:var(--ink);transform:translateX(-1px)}
#deckwrap .scale .pt.us{background:var(--accent);width:4px;transform:translateX(-2px);height:26px;top:16px}
#deckwrap .scale .lb{position:absolute;font-size:11.5px;white-space:nowrap;transform:translateX(-50%);color:var(--mute)}
#deckwrap .scale .lb.top{top:-4px}
#deckwrap .scale .lb.bot{top:40px}
#deckwrap .scale .lb.us{color:var(--accent-ink);font-weight:700}
#deckwrap .bmc dl{margin:0;display:grid;gap:6px;font-size:13px}
#deckwrap .bmc dl div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-top:1px solid var(--line2);padding-top:6px}
#deckwrap .bmc dt{color:var(--tx)}
#deckwrap .bmc dd{margin:0;font-family:var(--mono);color:var(--ink);text-align:right}
#deckwrap .bmc dd.us{color:var(--accent-ink);font-weight:600}
#deckwrap .src{font-size:11.5px;color:var(--faint);line-height:1.6}
#deckwrap .src a{color:var(--mute)}
#deckwrap .mk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:760px){#deckwrap .mk{grid-template-columns:1fr}}
#deckwrap .mk>div{padding:16px 20px;display:grid;gap:4px}
#deckwrap .mk .big{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ink);line-height:1.2}
#deckwrap .mk p{font-size:13px;color:var(--mute)}
#deckwrap .iss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){#deckwrap .iss{grid-template-columns:1fr}}
#deckwrap .iss>*{padding:16px 18px;display:grid;gap:8px;align-content:start}
#deckwrap .iss .res{font-size:12px;font-weight:700;color:var(--accent-ink)}
#deckwrap .iss h3{font-size:15px}
#deckwrap .iss ul{margin:0;padding-left:1.1em;font-size:13px;display:grid;gap:4px}
#deckwrap .iss ul b{font-family:var(--mono);font-weight:600;color:var(--ink)}
#deckwrap .strong{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:760px){#deckwrap .strong{grid-template-columns:1fr}}
#deckwrap .strong>div{padding:14px 18px;background:var(--good-soft);border-radius:12px;display:grid;gap:4px}
#deckwrap .strong .k{font-family:var(--mono);font-size:11.5px;color:var(--good)}
#deckwrap .strong b{color:var(--ink)}
#deckwrap .strong p{font-size:13px}
#deckwrap .cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){#deckwrap .cases{grid-template-columns:1fr}}
#deckwrap .case{padding:18px;display:grid;gap:8px;align-content:start}
#deckwrap .case .dwho{font-size:12px;color:var(--mute);font-weight:700}
#deckwrap .case h3{font-size:15px;line-height:1.5}
#deckwrap .case p{font-size:13px}
#deckwrap .case .num{font-family:var(--mono);font-size:14px;color:var(--accent-ink);font-weight:600}
#deckwrap .case .use{font-size:12.5px;border-top:1px solid var(--line2);padding-top:8px;color:var(--mute)}
#deckwrap .case .use b{color:var(--ink)}
#deckwrap .props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){#deckwrap .props{grid-template-columns:1fr}}
#deckwrap .prop{padding:18px;display:grid;gap:10px;align-content:start}
#deckwrap .prop .k{display:flex;gap:10px;align-items:baseline}
#deckwrap .prop .k span{font-family:var(--mono);font-size:22px;color:var(--accent);font-weight:600}
#deckwrap .prop .k em{font-style:normal;font-size:12px;font-weight:700;color:var(--mute)}
#deckwrap .prop h3{font-size:16px;line-height:1.5}
#deckwrap .kpi{display:grid;gap:4px}
#deckwrap .kpi div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:12.5px;border-top:1px solid var(--line2);padding-top:5px}
#deckwrap .kpi b{font-family:var(--mono);font-weight:600;color:var(--ink)}
#deckwrap .kpi b i{font-style:normal;color:var(--accent-ink)}
#deckwrap .prop ol{margin:0;padding-left:1.2em;font-size:13px;display:grid;gap:4px}
#deckwrap .fc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:hidden}
#deckwrap .fc>div{padding:22px}
#deckwrap .fc .now{border-right:1px solid var(--line)}
#deckwrap .fc .fut{background:var(--accent-soft)}
#deckwrap .fc .k{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
#deckwrap .fc .fut .k{color:var(--accent-ink)}
#deckwrap .fc table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
#deckwrap .fc td{padding:7px 0;border-top:1px solid var(--line2)}
#deckwrap .fc .fut td{border-top-color:rgba(178,58,23,.15)}
#deckwrap .fc td:last-child{text-align:right;font-family:var(--mono);color:var(--ink);font-weight:600}
#deckwrap .fc .fut td:last-child{color:var(--accent-ink)}
@media (max-width:640px){#deckwrap .fc{grid-template-columns:1fr}
#deckwrap .fc .now{border-right:0;border-bottom:1px solid var(--line)}}
#deckwrap .calc{margin-top:14px;padding:14px 18px;font-size:13px;display:grid;gap:4px}
#deckwrap .calc b{color:var(--ink)}
#deckwrap .road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){#deckwrap .road{grid-template-columns:1fr}}
#deckwrap .road>div{padding:16px 18px;display:grid;gap:6px;align-content:start}
#deckwrap .road .d{font-family:var(--mono);font-size:12px;color:var(--accent)}
#deckwrap .road h3{font-size:15px}
#deckwrap .road ul{margin:0;padding-left:1.1em;font-size:13px;display:grid;gap:3px}
#deckwrap .ask{margin-top:14px;padding:16px 20px;display:grid;gap:8px}
#deckwrap .ask h3{font-size:15px}
#deckwrap .ask label{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
#deckwrap .ask input{margin-top:5px;accent-color:var(--accent)}
#deckwrap .end{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
#deckwrap .btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:8px 18px;border:1px solid var(--line);background:var(--surface);text-decoration:none}
#deckwrap .btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#deckwrap .btn:hover{border-color:var(--accent)}
#deckwrap .notes{margin-top:18px;font-size:12px;color:var(--mute);display:grid;gap:4px}
#deckwrap .notes ul{margin:0;padding-left:1.1em;display:grid;gap:3px}
#deckwrap .ctl{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:6px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:5px}
#deckwrap .ctl button{border:0;background:transparent;color:var(--bg);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px}
#deckwrap .ctl button:hover{background:rgba(255,255,255,.12)}
#deckwrap .ctl button:disabled{opacity:.3;cursor:default}
#deckwrap .ctl .pg{font-family:var(--mono);font-size:12.5px;padding:0 6px;min-width:44px;text-align:center}
#deckwrap .ctl .nx{background:var(--accent)}
#deckwrap .ctl .nx:hover{background:var(--accent-ink)}
#deckwrap .dots{position:fixed;left:calc(max(10px,env(safe-area-inset-left,0px)));top:50%;transform:translateY(-50%);z-index:30;display:grid;gap:8px}
#deckwrap .dots a{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
#deckwrap .dots a.on{background:var(--accent);height:22px;border-radius:4px}
@media (max-width:1020px){#deckwrap .dots{display:none}}
#deckwrap aside.dnavi{position:fixed;right:max(24px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:var(--navi-w);z-index:30}
#deckwrap .dnv{padding:18px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#deckwrap .dnv .dwho{display:flex;gap:12px;align-items:center}
#deckwrap .dnv .dwho svg{flex:none;width:52px;height:52px}
#deckwrap .dnv .dwho b{display:block;font-size:14px;color:var(--ink)}
#deckwrap .dnv .dwho small{font-size:11.5px;color:var(--mute)}
#deckwrap .dbubble{position:relative;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.75;transition:opacity .25s}
#deckwrap .dbubble::before{content:"";position:absolute;left:22px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--accent-soft)}
#deckwrap .dbubble.fade{opacity:.15}
#deckwrap .drel{display:grid;gap:6px}
#deckwrap .drel .h{font-size:11.5px;color:var(--mute);font-weight:700}
#deckwrap .drel a{font-size:13px;text-decoration:none;display:flex;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
#deckwrap .drel a:hover{border-color:var(--accent);color:var(--accent-ink)}
#deckwrap .drel a::before{content:"→";color:var(--accent);font-family:var(--mono)}
#deckwrap .dnv .dtg{display:none;margin-left:auto;font-size:12px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px}
#deckwrap.cover-on aside.dnavi{opacity:0;pointer-events:none}
#deckwrap aside.dnavi{transition:opacity .3s}
@media (max-width:1020px){#deckwrap aside.dnavi{top:auto;transform:none;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));width:auto}
#deckwrap .dnv{max-width:520px;margin-left:auto;padding:12px 14px;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#deckwrap .dnv .dwho svg{width:38px;height:38px}
#deckwrap .dnv .drel{display:none}
#deckwrap .dnv.open .drel{display:grid}
#deckwrap .dnv .dtg{display:inline-flex}
#deckwrap .dbubble{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:9px 12px}
#deckwrap .dnv.open .dbubble{display:block}}
#deckwrap .dtoast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 16px;border-radius:999px;z-index:50}
#deckwrap details>summary{list-style:none;cursor:pointer}
#deckwrap details>summary::-webkit-details-marker{display:none}
#deckwrap .more{margin-top:14px}
#deckwrap .more>summary{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--accent-ink);padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
#deckwrap .more>summary::before{content:"＋";font-family:var(--mono)}
#deckwrap .more[open]>summary::before{content:"−"}
#deckwrap .more>summary:hover{border-color:var(--accent)}
#deckwrap .more[open]>summary{margin-bottom:12px}
#deckwrap .bmc .more{margin-top:0}
#deckwrap details.card{display:block}
#deckwrap details.card>summary{display:grid;gap:8px;position:relative;padding-right:34px}
#deckwrap details.card>summary::after{content:"＋";position:absolute;right:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;font-weight:700;font-family:var(--mono)}
#deckwrap details.card[open]>summary::after{content:"−"}
#deckwrap details.card:hover{border-color:var(--accent)}
#deckwrap details.card>.body{display:grid;gap:8px;margin-top:12px;border-top:1px solid var(--line2);padding-top:12px}
#deckwrap .tip{font-size:12px;color:var(--faint);margin:-8px 0 12px}
#deckwrap .plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#deckwrap .plist a{display:inline-flex;gap:8px;align-items:baseline;font-size:13.5px;text-decoration:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
#deckwrap .plist a b{font-family:var(--mono);color:var(--accent)}
#deckwrap .plist a:hover{border-color:var(--accent)}
#deckwrap .plist .h{font-size:12px;color:var(--mute);font-weight:700;align-self:center;margin-right:4px}
@media print{#deckwrap .ctl,#deckwrap .dots,#deckwrap aside.dnavi,#deckwrap .dtoast{display:none!important}
#deckwrap .slide{min-height:auto;page-break-after:always;break-after:page;border:0}
#deckwrap .inner{padding:24px 12px!important;max-width:none}
#deckwrap .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#deckwrap .more>summary,#deckwrap .tip,#deckwrap #openAll{display:none}
#deckwrap details.card>summary::after{display:none}}
@media (prefers-reduced-motion:reduce){#deckwrap .dbubble,#deckwrap aside.dnavi{transition:none}}
/* タブ（ポータル／定例資料） */
.bar .wrap{flex-wrap:wrap;row-gap:8px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--hero-mute);font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 14px}
.tabs button[aria-selected="true"]{background:var(--hero-tx);color:var(--hero)}
.tabs button:hover{color:var(--hero-tx)}
.tabs button[aria-selected="true"]:hover{color:var(--hero)}
body.t-teirei #topnav{display:none}
.tvbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px}
.tvsel{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 280px;max-width:520px}
.tvsel label{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c)));}
function mount(h){const app=document.getElementById("app");app.innerHTML=h;
 app.querySelectorAll("script").forEach(o=>{const s=document.createElement("script");s.textContent=o.textContent;o.replaceWith(s)});
 document.getElementById("gate").remove();if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}}
async function tryPw(pw,quiet){const btn=document.getElementById("go"),err=document.getElementById("err");btn.disabled=true;err.textContent=quiet?"":"確認しています…";
 try{const h=await unlock(pw);try{if(document.getElementById("rm").checked)sessionStorage.setItem(SK,pw)}catch(_){}mount(h)}
 catch(_){err.textContent=quiet?"":"パスワードが違います。もう一度入力してください。";btn.disabled=false;try{sessionStorage.removeItem(SK)}catch(_){}}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("pw").value,false)});
