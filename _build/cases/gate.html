<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>新規開拓 事例ポータル</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--tx:#16212e;--mute:#566474;--line:#d5dde6;--ac:#1d4f91}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--tx:#e8edf2;--mute:#9aa8b6;--line:#2c3846;--ac:#7fb0ea}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}
#gate form{width:100%;max-width:360px;display:grid;gap:12px}
#gate h1{font-size:18px;margin:0}#gate p{margin:0;color:var(--mute);font-size:14px}
#gate input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
#gate button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--bg);cursor:pointer}
#err{color:#c0392b;min-height:1.4em;font-size:13px}
</style></head><body>
<div id="gate"><form id="f"><h1>新規開拓 事例ポータル</h1><p>パスワードを入力してください。</p>
<input id="pw" type="password" autocomplete="current-password" aria-label="パスワード" autofocus><button id="go" type="submit">開く</button><div id="err" role="alert"></div></form></div>
<div id="app"></div>
<script>
const P=__PAYLOAD__;
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c)));}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const err=document.getElementById("err"),b=document.getElementById("go");
b.disabled=true;err.textContent="確認しています…";
try{const h=await unlock(document.getElementById("pw").value);
const app=document.getElementById("app");app.innerHTML=h;document.getElementById("gate").remove();
app.querySelectorAll("title,meta").forEach(x=>x.remove());app.querySelectorAll("script").forEach(o=>{const n=document.createElement("script");n.textContent=o.textContent;o.replaceWith(n)});
}
catch(x){err.textContent="パスワードが違います。";b.disabled=false}});
</script></body></html>
