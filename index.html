<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>インサイトセールス ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Shippori+Mincho+B1:wght@600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
:root{--g-bg:#ffffff;--g-tx:#1b1d21;--g-mute:#73767c;--g-line:#e3dfd5;--g-acc:#d9481f;--g-font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;--g-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-bg:#131416;--g-tx:#f0eee8;--g-mute:#9a9ca1;--g-line:#2b2d32;--g-acc:#f06a3e}}
:root[data-theme="dark"]{--g-bg:#131416;--g-tx:#f0eee8;--g-mute:#9a9ca1;--g-line:#2b2d32;--g-acc:#f06a3e}
body{margin:0;background:var(--g-bg)}
.gate{min-height:100vh;min-height:100dvh;background:var(--g-bg);color:var(--g-tx);font-family:var(--g-font);display:grid;place-items:center;padding-block:40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.gate form{width:100%;max-width:400px;display:grid;gap:14px}
.gate .eb{font-family:var(--g-mono);font-size:12px;color:var(--g-acc);letter-spacing:.06em}
.gate h1{margin:0;font-size:clamp(1.4rem,5vw,1.9rem);font-weight:700;line-height:1.4}
.gate p{margin:0;color:var(--g-mute);font-size:13.5px;line-height:1.7}
.gate label{font-size:12px;font-weight:700;color:var(--g-mute)}
.gate .f{display:flex;gap:8px}
.gate input[type=password]{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid var(--g-line);background:transparent;color:var(--g-tx)}
.gate button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:10px;padding:0 18px;background:var(--g-tx);color:var(--g-bg);cursor:pointer}
.gate button:disabled{opacity:.6}
.gate .err{color:var(--g-acc);font-size:13px;min-height:1.5em}
.gate .rm{display:flex;gap:8px;align-items:center;font-weight:500}
</style></head><body>
<div class="gate" id="gate"><form id="gf" autocomplete="off">
  <span class="eb">INSIGHT SALES PORTAL</span>
  <h1>株式会社ライトアップ<br>インサイトセールス ポータル</h1>
  <p>ご案内したパスワードを入力してください。パスワードに合わせて、御社専用のページが開きます。</p>
  <label for="pw">パスワード</label>
  <div class="f"><input id="pw" type="password" autocomplete="current-password" required><button id="go" type="submit">開く</button></div>
  <label class="rm"><input id="rm" type="checkbox" checked> このタブを閉じるまでパスワードを省略する</label>
  <p class="err" id="err" aria-live="polite"></p>
</form></div>
<div id="app"></div>
<script>
(()=>{const SK='lp-pw';const enc=new TextEncoder();const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(pw,salt,n,bits){const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:n,hash:'SHA-256'},base,bits))}
async function open(pw){const id=[...await pbk(pw,enc.encode('lightup-portal-id-v1'),150000,128)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const r=await fetch('k/'+id+'.json',{cache:'no-store'});if(!r.ok)throw new Error('nf');const P=await r.json();
  const raw=await pbk(pw,u8(P.s),P.n,256);const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c)))}
window.PORTAL={open};
function mount(h){const app=document.getElementById('app');app.innerHTML=h;app.querySelectorAll('script').forEach(o=>{const s=document.createElement('script');s.textContent=o.textContent;o.replaceWith(s)});document.getElementById('gate').remove();if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}}
async function tryPw(pw,quiet){const btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;err.textContent=quiet?'':'確認しています…';
  try{const h=await open(pw);try{if(document.getElementById('rm').checked)sessionStorage.setItem(SK,pw)}catch(_){}mount(h)}
  catch(_){err.textContent=quiet?'':'パスワードが違います。もう一度入力してください。';btn.disabled=false;try{sessionStorage.removeItem(SK)}catch(_){}}}
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryPw(document.getElementById('pw').value,false)});
try{const v=sessionStorage.getItem(SK);if(v)tryPw(v,true)}catch(_){}
})();
</script>
</body></html>
