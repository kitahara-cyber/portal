<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>インサイトセールス ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@400;600&display=swap">
<style>
:root{--bg:#ffffff;--tx:#1b1d21;--mute:#6b6e74;--line:#e3dfd5;--acc:#d9481f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131416;--tx:#f0eee8;--mute:#9a9ca1;--line:#2b2d32;--acc:#f06a3e}}
:root[data-theme="dark"]{--bg:#131416;--tx:#f0eee8;--mute:#9a9ca1;--line:#2b2d32;--acc:#f06a3e}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;letter-spacing:.03em}
.g{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:40px max(20px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:400px;display:grid;gap:14px}
.eb{font-family:Outfit,sans-serif;font-size:12px;color:var(--acc);letter-spacing:.08em}
h1{margin:0;font-size:clamp(1.4rem,5vw,1.9rem);font-weight:900;line-height:1.4}
p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.7}
label{font-size:12px;font-weight:700;color:var(--mute)}
.f{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx)}
button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:10px;padding:0 18px;background:var(--tx);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--acc);font-size:13px;min-height:1.5em}
</style></head><body>
<div class="g"><form id="gf" autocomplete="off">
  <span class="eb">INSIGHT SALES PORTAL</span>
  <h1>株式会社ライトアップ<br>インサイトセールス ポータル</h1>
  <p>ご案内したパスワードを入力してください。パスワードに合わせて、専用のページが開きます。</p>
  <label for="pw">パスワード</label>
  <div class="f"><input id="pw" type="password" autocomplete="current-password" required><button id="go" type="submit">開く</button></div>
  <p class="err" id="err" aria-live="polite"></p>
</form></div>
<script>
(()=>{const enc=new TextEncoder();
async function rid(pw){const b=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const v=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('lightup-portal-route-v1'),iterations:150000,hash:'SHA-256'},b,128));return [...v].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value,btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;err.textContent='確認しています…';
 try{const r=await fetch('r/'+await rid(pw)+'.json',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();try{sessionStorage.setItem(d.k,pw)}catch(_){}location.href=d.p}
 catch(_){err.textContent='パスワードが違います。もう一度入力してください。';btn.disabled=false}});
})();
</script>
</body></html>
