<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--card:#fbfaf6;--ink:#15171b;--tx:#15171b;--mute:#6b6a64;--line:#dedad0;--accent:#d9481f;--accent-ink:#b23a17;--accent-soft:#fbe7de;--good:#1f7a55;--good-soft:#e3f1e9;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181c;--card:#1f2227;--ink:#f1efe9;--tx:#f1efe9;--mute:#a19f97;--line:#33363c;--accent:#ef6a3d;--accent-ink:#f59a78;--accent-soft:#3a2219;--good:#5cc597;--good-soft:#18302a}}
*{box-sizing:border-box}body,#v-portal{background:var(--bg)!important;color:var(--tx)}#v-portal h1,#v-portal h2,#v-portal h3{color:var(--tx)}html{scroll-behavior:smooth;scroll-padding-top:110px}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.75 "Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-top:10px;padding-bottom:10px}.brand{font-weight:700;font-size:13px;letter-spacing:.08em}.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--mute);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}.tabs button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:6px 16px;background:none;color:inherit;cursor:pointer}.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.nav a{flex:none;font-size:13px;color:var(--mute);text-decoration:none;padding:4px 12px;border-radius:999px;border:1px solid var(--line)}.nav a:hover{color:var(--tx)}
.head{padding:28px 0 8px}.head .k{font:600 12px var(--mono);color:var(--accent-ink);letter-spacing:.06em}.head h1{font-size:clamp(22px,3.4vw,30px);line-height:1.35;margin:6px 0 4px}.head p{margin:0;color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi span{font-size:12px;color:var(--mute)}.kpi b{display:block;font:600 26px/1.25 var(--mono)}.kpi small{font-size:12px;color:var(--mute)}.up{color:var(--good)!important}.dn{color:var(--accent-ink)!important}
section.s{padding:30px 0 10px;border-top:1px solid var(--line);margin-top:22px}.s .no{font:600 12px var(--mono);color:var(--accent-ink);letter-spacing:.06em}.s h2{font-size:clamp(19px,2.6vw,23px);line-height:1.45;margin:4px 0 6px}.s h2 em{font-style:normal;color:var(--accent-ink)}.s .lead{margin:0 0 14px;color:var(--mute);font-size:13.5px}
.grid2>*,.land>*,.kpis>*{min-width:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.h3{font-size:14px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mute);font-weight:500}td.l{text-align:left;white-space:normal;min-width:7em}.mono{font-family:var(--mono)}
.tw{overflow-x:auto}.barc{display:inline-block;height:9px;border-radius:2px;background:var(--line);vertical-align:middle;margin-right:6px}.barc.a{background:var(--accent)}.barc.g{background:var(--good)}
.funnel{display:grid;gap:6px}.funnel div{display:grid;grid-template-columns:9em 1fr 5.5em;gap:8px;align-items:center;font-size:13px}.funnel i{display:block;height:12px;border-radius:3px;background:var(--line)}.funnel .hi i{background:var(--accent)}.funnel b{font-family:var(--mono);text-align:right}
.plans{display:grid;gap:10px;counter-reset:p}.plan{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px}.plan b{font-size:15px}.plan p{margin:4px 0 0;font-size:13px;color:var(--mute)}.plan .goal{color:var(--good);font-weight:700;font-size:13px;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}
.script{white-space:pre-wrap;font-size:13.5px;line-height:1.85;max-height:420px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0}
.quotes{display:grid;gap:8px;margin:0;padding:0;list-style:none}.quotes li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px}.quotes small{display:block;color:var(--mute);font-size:12px}
.land{display:grid;grid-template-columns:1fr 1fr;gap:12px}.land .panel b{display:block;font:600 24px var(--mono)}.land .best{border-color:var(--good);background:var(--good-soft)}.land dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:13px}.land dt{color:var(--mute)}.land dd{margin:0;font-family:var(--mono)}
details.more{margin-top:10px}details.more>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent-ink)}
.empty{color:var(--mute);font-size:13.5px}.foot{color:var(--mute);font-size:12px;padding:30px 0 60px}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.grid2,.land{grid-template-columns:1fr}.funnel div{grid-template-columns:7.5em 1fr 4.5em}.tabs{margin-left:0}}
@media print{.bar{position:static}.nav{display:none}}
</style><link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Serif+JP:wght@500;700;900&family=DM+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=M+PLUS+1p:wght@500;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DotGothic16&family=Press+Start+2P&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@600;800&display=swap" rel="stylesheet"><style id="p2">
[hidden]{display:none!important}
#v-portal.p2 h1,#v-portal.p2 h2,#v-portal.p2 h3,#v-portal.p2 h4{color:inherit}
#v-portal.p2{background:#0b0c0e!important;padding:0}
.h{position:relative;overflow:hidden;isolation:isolate;height:min(560px,calc(100dvh - 120px));min-height:440px;padding:clamp(24px,4.5vw,56px)}
.phone .h{height:560px}
.h .eye{font-size:12px;font-weight:700;letter-spacing:.14em;opacity:.7;position:relative;z-index:2}
.h .ttl{margin:4px 0 0;line-height:1.1;position:relative;z-index:2}
.h .one{margin:8px 0 0;font-size:15px;opacity:.85;position:relative;z-index:2}
.h .cnt{font-variant-numeric:tabular-nums}
.fadein{opacity:0;transform:translateY(10px)}.go .fadein{animation:fi .8s forwards}
@keyframes fi{to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-60}}
@media (prefers-reduced-motion:reduce){.h *,.h *::before,.h *::after{animation:none!important;transition:none!important}.h .fadein{opacity:1;transform:none}}

/* B1 山（リアル） */
.b1{background:#cfdbe6;color:#1f2a24}
.b1 .mtc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
/* */.b1 .ttl{font:900 clamp(40px,7.4vw,92px)/1.12 "Zen Kaku Gothic New","Noto Sans JP",sans-serif;text-shadow:0 2px 18px rgba(255,255,255,.7);letter-spacing:-.01em}.b1 .ttl em{font-style:normal;color:#2f7d5b;font-size:1.35em;line-height:1}.b1 .one{font-size:clamp(15px,1.6vw,19px);font-weight:700}.b1 .one b{color:#2f7d5b}.b1 .eye{font-size:13px}
.b1 .one,.b1 .eye{text-shadow:0 1px 8px rgba(255,255,255,.8)}
/* B2 ステージ（階段） */
.b2{background:radial-gradient(circle at 85% 10%,#e5e9ff,#f6f7fb 55%);color:#141a2e}
.b2 .stg{font:600 clamp(64px,10vw,120px)/.9 "IBM Plex Mono",monospace;color:#3d5afe;position:relative;z-index:2;margin-top:4px}.b2 .stg small{font-size:.32em;color:#9aa1bd}
.b2 .stairs{position:absolute;left:clamp(16px,4vw,56px);right:clamp(16px,4vw,56px);bottom:clamp(16px,3vw,32px);width:calc(100% - 2*clamp(16px,4vw,56px));height:auto;max-height:68%;z-index:1;overflow:visible}
.b2 .st rect{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}.b2.go .st rect{animation:grow .6s var(--d) forwards cubic-bezier(.2,.9,.3,1)}
@keyframes grow{to{transform:none}}
.b2 .st.done rect{fill:#3d5afe}.b2 .st.now rect{fill:#3d5afe;animation-name:grow,nowp!important;animation-duration:.6s,2s!important;animation-delay:var(--d),1.4s!important;animation-iteration-count:1,infinite!important}
@keyframes nowp{0%,100%{transform:none;fill:#3d5afe}50%{transform:none;fill:#6b82ff}}
.b2 .st.fut rect{fill:transparent;stroke:#b8c0dd;stroke-width:2;stroke-dasharray:6 6}.b2 .st.goal rect{fill:transparent;stroke:#3d5afe;stroke-width:2.5;stroke-dasharray:6 6}
.b2 .st.done rect{animation-name:grow,sweep!important;animation-duration:.6s,3.2s!important;animation-delay:var(--d),calc(1.6s + var(--d))!important;animation-iteration-count:1,infinite!important}
@keyframes sweep{0%,70%,100%{transform:none;fill:#3d5afe}35%{transform:none;fill:#7d93ff}}
.b2 .st text{font:500 13px "Noto Sans JP",sans-serif;text-anchor:middle}.b2 .st .m{fill:#fff;font-weight:700}.b2 .st.fut .m,.b2 .st.goal .m{fill:#8a91ad}
.b2 .st .t{fill:#5b6280;opacity:0}.b2.go .st .t{animation:fi .4s calc(var(--d) + .5s) forwards}.b2 .st.now .t{fill:#3d5afe;font-weight:700}.b2 .st.goal .t{fill:#3d5afe;font-weight:700}
.b2 .me{animation:hop 1.2s ease-in-out infinite}.b2 .me circle{fill:#141a2e}.b2 .me .halo{fill:none;stroke:#3d5afe;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes hop{0%,100%{translate:0 -22px}50%{translate:0 -34px}}
.b2 .spark circle{fill:#3d5afe;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@container st (max-width:720px){.b2 .st .t{display:none}.b2 .st.now .t,.b2 .st.goal .t{display:block}.b2 .st text{font-size:24px}}
/* B3 路線 */
.b3{background:#f6f6f2;color:#1c1f24;display:grid;align-content:center}
.b3 .ttl{font-size:clamp(40px,7vw,80px);font-weight:900}
.b3 svg{width:100%;height:auto;margin-top:26px;overflow:visible}
.b3 .fut{stroke-dasharray:8 12;animation:flow 1.6s linear infinite}
.b3 .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@container st (max-width:720px){.b3 svg text{font-size:36px}.b4 .mast .dt{display:none}}
.b3 .train{transition:transform 2.4s .3s cubic-bezier(.4,0,.2,1)}
.b3 .bob{animation:bob .6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}
/* B4 経済紙 */
.b4{background:#faf8f3;color:#1a1a1a}
.b4 .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #1a1a1a;padding-bottom:6px;font-size:13px;gap:10px}.b4 .mast b{font:800 22px "Noto Serif JP",serif;letter-spacing:.08em}
.b4 .ttl{font:800 clamp(38px,6.4vw,76px)/1.2 "Noto Serif JP",serif;margin-top:22px}
.b4 svg.c{position:absolute;right:clamp(16px,4vw,56px);bottom:70px;width:min(46%,520px);z-index:1}
@container st (max-width:720px){.b4 svg.c{width:88%;bottom:60px}}
.b4 .ln{stroke-dasharray:500;stroke-dashoffset:500}.b4.go .ln{animation:dr 1.8s .5s forwards}
.b4 .pt{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.b4 .tick{position:absolute;left:0;right:0;bottom:0;background:#1a1a1a;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;padding:8px 0;z-index:2}.b4 .tick span{display:inline-block;padding-left:100%;animation:tk 26s linear infinite}@keyframes tk{to{transform:translateX(-100%)}}
.b4 .clk{font-family:"IBM Plex Mono",monospace}
/* B5 運用 */
.b5{background:#0e1319;color:#e9eef5;background-image:linear-gradient(#1a222d 1px,transparent 1px),linear-gradient(90deg,#1a222d 1px,transparent 1px);background-size:48px 48px;animation:grid 20s linear infinite}
@keyframes grid{to{background-position:48px 48px}}
.b5 .ttl{font:600 clamp(80px,14vw,160px)/1 "IBM Plex Mono",monospace;color:#2fd696}.b5 .ttl small{font:500 .16em "Noto Sans JP";color:#8a95a5;margin-left:10px;vertical-align:middle}
.b5 svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:56%;z-index:1}
.b5 .ln{stroke-dasharray:1400;stroke-dashoffset:1400}.b5.go .ln{animation:dr 1.8s .2s forwards}
.b5 .pt{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
/* B6 管制 */
.b6{background:radial-gradient(ellipse at 70% 40%,#16305a,#0a1322 65%);color:#e6eefb}
.b6 .radar{position:absolute;right:-8%;top:50%;width:min(80cqw,640px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 58px,rgba(92,200,255,.14) 58px 59px);z-index:0}
.b6 .radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(92,200,255,.28),transparent 22%);animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.b6 .pill{display:inline-flex;gap:8px;align-items:center;border:1px solid #5cc8ff;color:#5cc8ff;border-radius:999px;padding:4px 14px;font:600 13px "IBM Plex Mono",monospace;letter-spacing:.12em;position:relative;z-index:2}.b6 .pill i{width:9px;height:9px;border-radius:50%;background:#2fe39a;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.2}}
.b6 .ttl{font-size:clamp(36px,6vw,68px);font-weight:900;margin-top:14px}
.b6 svg.o{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:min(60cqw,520px);z-index:1}
.b6 .tj{stroke-dasharray:6 8;animation:flow 2s linear infinite}
.b6 .gs{position:absolute;left:clamp(24px,4.5vw,56px);bottom:clamp(24px,4vw,48px);display:flex;gap:12px;z-index:2}
.b6 .g{text-align:center}.b6 .g svg{width:90px;display:block}.b6 .g b{font:600 15px "IBM Plex Mono",monospace}
.b6 .g .nd{transform-origin:50px 52px;animation:jit 3s ease-in-out infinite}@keyframes jit{50%{transform:rotate(var(--j,3deg))}}
/* B7 スコア */
.b7{background:#0f1a14;color:#fff;display:grid;align-content:center}
.b7 .eye{color:#9fb5a7}
.b7 .sb{margin-top:14px;border:6px solid #23382b;border-radius:10px;padding:14px;overflow-x:auto;background:#0a120d;position:relative}
.b7 .sb::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);background-size:250% 100%;animation:sheen 4s linear infinite;pointer-events:none}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.b7 table{border-collapse:collapse;width:100%;min-width:620px;text-align:center;font:600 clamp(20px,2.6vw,32px) "IBM Plex Mono",monospace}
.b7 th{font:500 12px "Noto Sans JP";color:#9fb5a7;padding:4px}.b7 td{padding:12px 4px;border-left:1px solid #1e2f24}.b7 td.t{text-align:left;font:700 13px "Noto Sans JP";border-left:0;white-space:nowrap;color:#cfe0d5}
.b7 .on{opacity:0}.b7.go .on{animation:fi .25s forwards}.b7 .q{color:#3f5a4a}
.b7 .hi{color:#ffd54a;text-shadow:0 0 12px rgba(255,213,74,.6)}
.b7 .now{animation:lit 1.6s ease-in-out infinite}@keyframes lit{50%{background:rgba(255,213,74,.14)}}

/* G1 クエスト */
.g1{background:#070a2b;color:#fff;font-family:"DotGothic16",monospace;display:grid;align-content:center;justify-items:center;gap:22px}
.g1stars{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#9fb3ff 1px,transparent 1.5px);background-size:90px 90px,140px 140px;background-position:0 0,40px 60px;animation:stars 40s linear infinite;opacity:.5}
@keyframes stars{to{background-position:0 -900px,40px -1340px}}
.g1w{width:min(620px,100%);border:4px solid #fff;border-radius:10px;background:linear-gradient(#1b2aa8,#0a1260);box-shadow:inset 0 0 0 3px #0a1260,0 0 0 2px #000;padding:18px 20px;display:grid;gap:14px}
.g1p{display:flex;gap:14px;align-items:center}.g1p img{width:72px;height:72px;border-radius:6px;border:3px solid #fff;object-fit:cover;animation:bob .8s steps(2) infinite alternate}
.g1n{font-size:18px}.g1lv{font-size:clamp(34px,6vw,54px);color:#ffe14d;line-height:1}.g1lv b{font-weight:400}
.g1bars{display:grid;gap:8px}.g1bars div{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center;font-size:15px}
.g1bars i{display:block;height:16px;border:2px solid #fff;background:#000;position:relative;overflow:hidden}
.g1bars i b{position:absolute;inset:0 auto 0 0;width:0;background:#4dff7a;transition:width 1.4s .3s steps(20)}.g1bars i b.y{background:#ffe14d}.g1.go .g1bars i b{width:var(--w)}
.g1bars i b::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:shim 2s steps(10) infinite}
.g1q{font-size:clamp(17px,2.4vw,22px)}.g1q b{color:#ffe14d;font-weight:400}.blink{animation:bl 1s steps(1) infinite;color:#ffe14d}
/* G2 すごろく */
.g2{background:#ffe7a1;background-image:radial-gradient(#f3d071 2px,transparent 2.5px);background-size:22px 22px;color:#3a2410;font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif}
.g2b{position:absolute;inset:16% 4% 8% 4%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:12px}
.g2 .sq{border-radius:18px;border:4px solid #3a2410;background:#fff;box-shadow:0 6px 0 #3a2410;display:grid;place-items:center;font-weight:800;font-size:clamp(14px,2vw,22px);position:relative}
.g2 .sq.d{background:#fff3cf}.g2 .sq.c{background:#ff7a45;color:#fff}.g2 .sq.f{background:repeating-linear-gradient(45deg,#fff,#fff 8px,#fff3cf 8px,#fff3cf 16px)}
.g2 .sq.g{background:#3dbb6c;color:#fff;animation:goalg 1.6s ease-in-out infinite}@keyframes goalg{50%{box-shadow:0 6px 0 #3a2410,0 0 0 8px rgba(61,187,108,.35)}}
.g2 .tok{position:absolute;top:-30px;width:clamp(40px,6vw,60px);height:clamp(40px,6vw,60px);border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 #3a2410;object-fit:cover;animation:hopg .5s ease-out infinite alternate}
@keyframes hopg{to{transform:translateY(-14px)}}
.g2 .die{position:absolute;right:5%;top:5%;width:58px;height:58px;border-radius:12px;background:#fff;border:4px solid #3a2410;display:grid;place-items:center;font:800 28px "M PLUS Rounded 1c";animation:roll2 4s ease-in-out infinite}
@keyframes roll2{0%,80%{transform:none}90%{transform:rotate(200deg) scale(1.15)}100%{transform:rotate(360deg)}}
/* G3 8bit */
.g3{background:#5c94fc;color:#fff;font-family:"Press Start 2P","DotGothic16",monospace;image-rendering:pixelated}
.g3hud{display:flex;justify-content:space-between;font-size:clamp(10px,1.5vw,15px);text-shadow:2px 2px 0 #000;gap:10px;flex-wrap:wrap;position:relative;z-index:3}
.g3cl{position:absolute;width:110px;height:34px;background:#fff;border-radius:17px;box-shadow:28px -12px 0 -4px #fff,56px 0 0 #fff;animation:cloud 34s linear infinite;z-index:0}
.g3hill{position:absolute;left:0;right:0;bottom:64px;height:110px;background:radial-gradient(ellipse 120px 110px at 120px 110px,#2fa84f 98%,transparent 100%) 0 0/420px 110px repeat-x;animation:scrollx 14s linear infinite;z-index:1}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c));
 if(typeof PZ!=="undefined")return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 return new TextDecoder().decode(buf);}
function mount(h){const app=document.getElementById("app");app.innerHTML=h;
 app.querySelectorAll("script").forEach(o=>{const s=document.createElement("script");s.textContent=o.textContent;o.replaceWith(s)});
 document.getElementById("gate").remove();if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}}
async function tryPw(pw,quiet){const btn=document.getElementById("go"),err=document.getElementById("err");btn.disabled=true;err.textContent=quiet?"":"確認しています…";
 try{const h=await unlock(pw);try{if(document.getElementById("rm").checked)sessionStorage.setItem(SK,pw)}catch(_){}mount(h)}
 catch(_){err.textContent=quiet?"":"パスワードが違います。もう一度入力してください。";btn.disabled=false;try{sessionStorage.removeItem(SK)}catch(_){}}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("pw").value,false)});
try{const v=sessionStorage.getItem(SK);if(v)tryPw(v,true)}catch(_){}
</script>
