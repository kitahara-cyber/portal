name: 事例ポータルを更新

on:
  schedule:
    - cron: '17 * * * *'   # 毎時17分(スプシの変更は最大1時間で反映)
  workflow_dispatch:        # 画面から「今すぐ更新」できる

permissions:
  contents: write

concurrency:
  group: cases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: スプシから読み込んで暗号化
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: node _build/cases/build.js cases/index.html
      - name: 変更があれば公開
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add cases/index.html cases/index.html.tag
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "事例ポータルを更新(スプシの変更を反映)"
            git push
          fi
