<meta name="robots" content="noindex,nofollow">
<title>新規開拓 事例ポータル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* Layout: トップで業種を選ぶ → 業種別LP → 事例詳細。デザインは4種類を切り替え(右上) */
#sk{--f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;--f-head:var(--f-body);--f-num:"Barlow Condensed","Noto Sans JP",sans-serif;--r:12px;--rb:999px;--rbadge:50%;--bw:1px}
/* 1 ブルー(事例サイト型) */
#sk[data-skin="1"]{--bg:#ffffff;--soft:#eef3f8;--ink:#16212e;--sub:#566474;--line:#d5dde6;--brand:#1d4f91;--brand-ink:#fff;--hero:#1d4f91;--hero-ink:#fff;--badge-bg:#fff;--badge-ink:#1d4f91;--cta:#f07a1a;--cta-ink:#fff;--good:#1d4f91;--warn:#c96a00;--bar:#1d4f91;--bar-lo:#a9bdd6}
/* 2 雑誌(エディトリアル) */
#sk[data-skin="2"]{--bg:#ffffff;--soft:#f5f5f3;--ink:#141414;--sub:#666a70;--line:#dcdcd8;--brand:#c8261f;--brand-ink:#fff;--hero:#141414;--hero-ink:#fff;--badge-bg:#fff;--badge-ink:#141414;--cta:#141414;--cta-ink:#fff;--good:#c8261f;--warn:#8a5a00;--bar:#141414;--bar-lo:#c9c9c4;--f-head:"Shippori Mincho B1","Noto Serif JP",serif;--f-num:"Shippori Mincho B1","Noto Serif JP",serif;--r:0px;--rb:0px;--rbadge:0px}
/* 3 データ(ダッシュボード) */
#sk[data-skin="3"]{--bg:#0b121a;--soft:#101a25;--ink:#e6eef6;--sub:#8ea2b5;--line:#22344a;--brand:#4cc9f0;--brand-ink:#0b121a;--hero:#0b121a;--hero-ink:#e6eef6;--badge-bg:#101a25;--badge-ink:#4cc9f0;--cta:#4cc9f0;--cta-ink:#0b121a;--good:#5be3a0;--warn:#ffb454;--bar:#4cc9f0;--bar-lo:#27465f;--f-head:"Noto Sans JP",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace;--r:6px;--rb:6px;--rbadge:6px}
/* 4 ストーリー(大きく・やさしく) */
#sk[data-skin="4"]{--bg:#fbfdfb;--soft:#eaf4ec;--ink:#1d2a22;--sub:#58695e;--line:#cfe0d3;--brand:#1f7a4d;--brand-ink:#fff;--hero:#1f7a4d;--hero-ink:#fff;--badge-bg:#fff;--badge-ink:#1f7a4d;--cta:#e8742c;--cta-ink:#fff;--good:#1f7a4d;--warn:#b5651d;--bar:#1f7a4d;--bar-lo:#a9cdb5;--f-head:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;--f-body:"M PLUS Rounded 1c","Noto Sans JP",sans-serif;--r:22px;--rb:999px;--rbadge:50%}
#sk{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);padding-bottom:84px}
.final .ph{border-color:currentColor}
a{color:inherit}
.in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance;font-family:var(--f-head)}
p{margin:0}
section{padding-block:52px}
section.soft{background:var(--soft)}
.h2{text-align:center;font-size:clamp(22px,4.2vw,30px);font-weight:900;margin-bottom:8px}
.h2 em{font-style:normal;color:var(--brand)}
.h2-sub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cta);color:var(--cta-ink);font-weight:700;text-decoration:none;padding:14px 26px;border-radius:var(--rb);font-size:16px}
.btn.ghost{background:transparent;color:var(--hero-ink);border:2px solid var(--hero-ink)}
.skins{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.skins button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 10px;cursor:pointer;border-radius:var(--rb)}
.skins button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--cta);outline-offset:3px}
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .in{display:flex;justify-content:space-between;align-items:center;padding-block:10px;gap:12px;font-size:14px}
.top a{text-decoration:none;font-weight:700}
.top .crumb{color:var(--sub);font-weight:400}

.hero{background:var(--hero);color:var(--hero-ink);padding-block:36px 44px}
.hero .in{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.kicker{display:inline-block;background:var(--badge-bg);color:var(--badge-ink);font-weight:700;font-size:13px;padding:2px 12px;border-radius:4px;margin-bottom:12px}
.hero h1{font-size:clamp(25px,4.8vw,40px);font-weight:900}
.hero h1 mark{background:var(--badge-bg);color:var(--badge-ink);padding:0 .25em;border-radius:4px;display:inline-block}
.hero p.lead{margin-top:14px;opacity:.92}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{background:var(--badge-bg);color:var(--badge-ink);border-radius:var(--rbadge);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;min-width:0}
.badge:first-child{grid-column:1/-1;width:62%;justify-self:center}
.badge .t{font-size:12px;font-weight:700}
.badge .n{white-space:nowrap;font-family:var(--f-num);font-size:clamp(30px,5.4vw,46px);font-weight:700;line-height:1.05}
.badge .n small{font-size:.45em}
.badge .u{font-size:11px;font-weight:500}
.src{font-size:11.5px;opacity:.8;margin-top:10px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--brand);transform:translateY(-2px)}
.tile .nm{font-size:18px;font-weight:900;color:var(--brand)}
.tile .ex{font-size:13px;color:var(--sub);line-height:1.6}
.tile .st{display:flex;gap:18px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.tile .st b{font-family:var(--f-num);font-size:30px;line-height:1;display:block}
.tile .st span{font-size:12px;color:var(--sub)}
.tile .go{font-size:13px;font-weight:700;color:var(--cta)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rs{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;position:relative}
.rs .no{position:absolute;top:-12px;left:14px;background:var(--brand);color:var(--brand-ink);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:700}
.rs h3{font-size:17px;color:var(--brand);margin-bottom:6px}
.rs p{font-size:14px;color:var(--sub);line-height:1.7}

.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.cs{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
a.cs:hover{border-color:var(--brand)}
.cs-h{padding:14px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.cs-h .tag{background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:6px;padding:0 10px;white-space:nowrap}
.cs-h h3{font-size:16px}
.cs-n{padding:16px 18px 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cs-n .big{font-family:var(--f-num);font-size:56px;font-weight:700;line-height:1;color:var(--brand)}
.cs-n .big small{font-size:.5em}
.cs-n .lb{font-size:13px;color:var(--sub)}
.cs-n .vs{margin-left:auto;font-size:12px;font-weight:700;padding:2px 10px;border-radius:var(--rb);border:1px solid currentColor}
.vs.up{color:var(--good)} .vs.dn{color:var(--warn)}
.cs-m{display:grid;grid-template-columns:1fr 1fr;margin:8px 18px 0;border-top:1px solid var(--line)}
.cs-m div{padding:8px 0;font-size:13px;color:var(--sub)}
.cs-m b{display:block;font-family:var(--f-num);font-size:24px;color:var(--ink);line-height:1.2}
.cs-p{padding:10px 18px 14px;font-size:14px}
.cs-p b{color:var(--brand)}
.cs-go{padding:0 18px 16px;font-size:13px;font-weight:700;color:var(--cta);margin-top:auto}
.note{font-size:12.5px;color:var(--sub);text-align:center;margin-top:18px}

/* detail */
.dh{background:var(--hero);color:var(--hero-ink);padding-block:30px 36px}
.dh .tag{background:var(--badge-bg);color:var(--badge-ink);font-weight:700;border-radius:6px;padding:1px 12px}
.dh h1{font-size:clamp(24px,4.6vw,36px);font-weight:900;margin-top:10px}
.dh p{margin-top:8px;opacity:.92}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg);margin-top:-26px;position:relative}
.kpis>div{padding:16px 18px;border-right:1px solid var(--line)}
.kpis>div:last-child{border-right:0}
.kpis b{font-family:var(--f-num);font-size:38px;line-height:1.1;display:block;color:var(--brand)}
.kpis span{font-size:12.5px;color:var(--sub)}
.story{display:grid;gap:14px}
.sb{display:grid;grid-template-columns:140px 1fr;gap:16px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.sb .lab{font-weight:900;color:var(--brand);font-size:15px}
.sb ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.sb p{font-size:15px}
.sb.ac{border-color:var(--brand)}
.sb ul.tl{list-style:none;padding:0;display:grid;gap:8px}
.sb ul.tl li b{color:var(--brand);margin-right:6px}
.sb.pb{border-left:4px solid var(--brand)}

.flow3{display:grid;grid-template-columns:1fr auto 1.2fr auto 1.2fr;gap:12px;align-items:stretch;margin-top:30px}
.fc{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.fc.em{border:2px solid var(--brand)}
.fc.res{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.fc.res .sm{color:inherit;opacity:.9}
.fk{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--brand)}
.fc.res .fk{color:inherit;opacity:.85}
.fa{align-self:center;font-family:var(--f-num);font-size:26px;color:var(--sub)}
.ln{font-size:14.5px;line-height:1.7;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0;padding-bottom:0}
.big2{font-size:18px;font-weight:700;line-height:1.6}
.sm{font-size:13.5px;color:var(--sub);line-height:1.7}
.pcs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pc{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.pc-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.pc-h b{font-size:16px;color:var(--brand)}
.pc-h span{font-size:12px;color:var(--sub)}
.pc .main{font-size:15.5px;line-height:1.8}
.mo{font-size:14px;color:var(--sub)}
.mo summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:13px}
.mo p{margin-top:8px;padding-left:12px;border-left:3px solid var(--line)}
.chipw{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13.5px;border:1px solid var(--line);background:var(--soft);padding:4px 12px;border-radius:var(--rb);line-height:1.6}
.tlw{margin-top:28px}
.h3{font-size:18px;margin-bottom:14px}
.h3 span{font-size:12.5px;font-weight:400;color:var(--sub);margin-left:10px}
.tl2{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--line);display:grid;gap:18px}
.tl2 li{position:relative}
.tl2 .dot{position:absolute;left:-30px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--brand);border:3px solid var(--soft)}
.tl2 b{display:block;color:var(--brand);font-size:14px}
.tl2 p{font-size:15px}
.deal{margin-top:28px;background:var(--bg);border:2px solid var(--brand);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.top .in{flex-wrap:wrap;row-gap:6px}.top .crumb{order:3;width:100%;font-size:12.5px}.skins{flex-wrap:wrap}.skins button{white-space:nowrap}.flow3{grid-template-columns:1fr}.fa{transform:rotate(90deg);justify-self:center}.pcs{grid-template-columns:1fr}}

/* ===== 共通部品(新レイアウト用) ===== */
.vh{position:absolute;left:-9999px}
.hl-plain mark{background:none;color:inherit;padding:0}
/* ===== 2 雑誌 ===== */
.e-hero{padding-block:64px 36px}
.e-k{font-size:12px;letter-spacing:.2em;color:var(--brand);font-weight:700;margin-bottom:18px}
.e-hero h1{font-size:clamp(30px,6vw,56px);font-weight:800;line-height:1.35;max-width:14em}
.e-lead{max-width:34em;margin-top:20px;color:var(--sub);font-size:17px}
.e-nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);margin-top:40px}
.e-nums>div{padding:16px 0;border-right:1px solid var(--line);padding-left:18px}
.e-nums>div:first-child{padding-left:0}.e-nums>div:last-child{border-right:0}
.e-nums b{font-family:var(--f-num);font-size:clamp(30px,5vw,48px);font-weight:800;display:block;line-height:1.1}
.e-nums span{font-size:12.5px;color:var(--sub)}
.e-h{font-size:13px;letter-spacing:.2em;font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:8px;margin:48px 0 0}
.e-idx{list-style:none;margin:0;padding:0}
.e-idx a,.e-row{display:grid;grid-template-columns:48px 1fr auto 32px;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none}
.e-idx a:hover,.e-row:hover{background:var(--soft)}
.e-n{font-family:var(--f-num);color:var(--sub);font-size:14px}
.e-t{font-family:var(--f-head);font-size:clamp(18px,3vw,24px);font-weight:800}
.e-t small,.e-m small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--sub);margin-top:2px}
.e-r{font-family:var(--f-num);font-weight:800;font-size:clamp(22px,4vw,34px);white-space:nowrap}
.e-r small{font-size:.5em;font-weight:600}
.e-r em{display:block;font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--sub)}
.e-a{color:var(--brand);font-size:20px;text-align:right}
.e-row{grid-template-columns:56px 1fr auto 32px}
.e-l{font-family:var(--f-head);font-weight:800;background:var(--ink);color:var(--bg);text-align:center;padding:2px 0;font-size:14px}
.e-m b{font-family:var(--f-head);font-size:clamp(17px,2.6vw,21px)}
.e-pts{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:24px}
.e-pts div{border-top:2px solid var(--ink);padding-top:12px}
.e-pts h3{font-size:18px;margin-bottom:6px}
.e-pts p{font-size:14.5px;color:var(--sub)}
.e-art{display:grid;grid-template-columns:260px 1fr;gap:48px;padding-block:40px}
.e-side{position:sticky;top:16px;align-self:start;border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:16px}
.e-side .k b{font-family:var(--f-num);font-size:38px;font-weight:800;line-height:1.1;display:block}
.e-side .k span{font-size:12.5px;color:var(--sub)}
.e-side .tag{font-family:var(--f-head);font-weight:800;background:var(--ink);color:var(--bg);padding:1px 10px;align-self:flex-start}
.e-body h1{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.35}
.e-dek{color:var(--sub);margin:10px 0 28px;font-size:16px}
.e-body h2{font-size:13px;letter-spacing:.2em;font-weight:700;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:36px 0 14px;color:var(--brand)}
.e-body p{font-size:17px;line-height:2;margin-bottom:10px}
.e-body .pull{font-family:var(--f-head);font-size:clamp(20px,3vw,26px);font-weight:800;line-height:1.7;border-left:4px solid var(--brand);padding-left:18px;margin:12px 0 14px}
.e-body .dl{display:grid;grid-template-columns:120px 1fr;gap:4px 16px;margin-bottom:10px}
.e-body .dl b{font-family:var(--f-num);color:var(--brand);font-size:14px;padding-top:4px}
.e-body .dl p{margin:0;font-size:16px;line-height:1.9}
.e-body .q{color:var(--sub);font-size:15px}
/* ===== 3 データ ===== */
.d-wrap{padding-block:24px 40px}
.d-t{font-size:12px;letter-spacing:.12em;color:var(--sub);margin:28px 0 8px;font-weight:700}
.d-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.d-k{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.d-k span{font-size:12px;color:var(--sub);display:block}
.d-k b{font-family:var(--f-num);font-size:32px;font-weight:600;line-height:1.2;color:var(--brand)}
.d-k small{font-size:11.5px;color:var(--sub);display:block}
.d-pan{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.d-pan h3{font-size:12px;letter-spacing:.1em;color:var(--brand);margin-bottom:8px}
.d-pan p{font-size:14.5px;line-height:1.8}
.d-pan .sub{color:var(--sub);font-size:12.5px;margin-top:6px}
.d-grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.d-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.d-tbl{width:100%;border-collapse:collapse;font-size:14px}
.d-tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--soft)}
.d-tbl th{font-size:11.5px;color:var(--sub);text-align:left;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.d-tbl td{color:var(--ink);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.d-tbl tr:last-child td{border-bottom:0}
.d-tbl tbody tr{cursor:pointer}.d-tbl tbody tr:hover{background:var(--bg)}
.d-tbl a{text-decoration:none;color:var(--ink);font-weight:700}
.d-tbl .n{font-family:var(--f-num);text-align:right}
.d-tbl th.n{text-align:right}
.d-bar{display:inline-block;height:8px;background:var(--brand);border-radius:2px;vertical-align:middle;margin-right:8px}
.d-sp{display:inline-flex;align-items:flex-end;gap:1px;height:22px;vertical-align:middle}
.d-sp i{display:block;width:3px;background:var(--bar);min-height:1px}
.d-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.d-chips a{font-size:13px;border:1px solid var(--line);padding:4px 12px;border-radius:var(--rb);text-decoration:none;color:var(--ink);background:var(--soft)}
.d-chips a:hover{border-color:var(--brand);color:var(--brand)}
.d-head h1{font-size:clamp(22px,4vw,32px);font-weight:900}
.d-head .tag{background:var(--brand);color:var(--brand-ink);font-family:var(--f-num);padding:1px 10px;border-radius:4px;font-weight:600}
.d-head p{color:var(--sub);font-size:14px;margin-top:4px}
.d-tl{display:grid;grid-template-columns:150px 1fr;gap:0}
.d-tl>div{padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.d-tl>div:nth-child(odd){color:var(--brand);font-family:var(--f-num);font-size:13px}
/* ===== 4 ストーリー ===== */
.s-hero{text-align:center;padding-block:56px 36px;background:var(--soft)}
.s-hero h1{font-size:clamp(28px,6vw,46px);font-weight:900;line-height:1.5}

function home(){return [null,home1,home2,home3,home4][SKIN]()}

var CUR="#/";
function route(keep){if(!keep)FILT={cat:"",emp:"",rev:"",pref:""};var h=location.hash||"#/";var m;var v=document.getElementById("v");
 if(!/^#\/(i|c)\//.test(h)&&h!=="#/"&&h!=="#"&&h!==""){if(!keep)return;h=CUR}
 if(m=h.match(/^#\/i\/([A-Z])$/))v.innerHTML=industry(m[1]);
 else if(m=h.match(/^#\/c\/(\d+)$/))v.innerHTML=detail(+m[1]);
 else v.innerHTML=home();
 CUR=h;applySkin();if(!keep)window.scrollTo(0,0)}

route();applySkin();
if(!document.getElementById('v').innerHTML)document.getElementById('v').innerHTML=home();
