const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c)));}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const err=document.getElementById("err"),b=document.getElementById("go");
b.disabled=true;err.textContent="確認しています…";
try{const h=await unlock(document.getElementById("pw").value);
const app=document.getElementById("app");app.innerHTML=h;document.getElementById("gate").remove();
app.querySelectorAll("title,meta").forEach(x=>x.remove());
if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}}
catch(x){err.textContent="パスワードが違います。";b.disabled=false}});
