<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>インサイトセールス営業ベンチマーク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}

/* Layout: 「貴社の数値」を入力 → 3指標を平均と並べて判定 → 1,000コール換算の比較 → 業種別の表、の順に一本で読む。デザインは4種を切替 */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#10201D; --muted:#586966; --line:#D5DEDB;
  --accent:#0F6B5C; --accent-soft:#DCEDE8;
  --own:#C2620A; --own-soft:#FBEBD0;
  --up:#13795B; --down:#B5452F;
  --hero-bg:#0E2421; --hero-fg:#EAF3F0; --hero-muted:#93AFA8; --hero-hi:#7FE0C6;
  --pick1:#C2410C; --pick2:#1D4ED8; --pick3:#7C3AED;
  --r:14px;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  color-scheme:light;
}
/* B ネイビー */
:root[data-design="b"]{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#131B2E; --muted:#566077; --line:#D8DDE8;
  --accent:#1E3A8A; --accent-soft:#E1E7F6; --own:#D4530F; --own-soft:#FDE7D6;
  --up:#0F7A55; --down:#B3341F;
  --hero-bg:#0F1B3D; --hero-fg:#EDF1FB; --hero-muted:#A3B0D1; --hero-hi:#8FB4FF;
  --pick1:#B91C1C; --pick2:#047857; --pick3:#7E22CE; --r:6px; color-scheme:light;
}
/* C モノクロ */
:root[data-design="c"]{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#111111; --muted:#555555; --line:#D4D4D4;
  --accent:#111111; --accent-soft:#E8E8E8; --own:#D7263D; --own-soft:#FBDADF;
  --up:#1B7F4B; --down:#D7263D;
  --hero-bg:#111111; --hero-fg:#FFFFFF; --hero-muted:#B5B5B5; --hero-hi:#FF6B7F;
  --pick1:#D7263D; --pick2:#0057B8; --pick3:#7A5200; --r:0px; color-scheme:light;
}
/* D ダーク */
:root[data-design="d"]{
  --bg:#0A1018; --surface:#121C28; --ink:#E6EEF7; --muted:#8FA3B8; --line:#223244;
  --accent:#38BDF8; --accent-soft:#10293B; --own:#FBBF24; --own-soft:#3A2E0E;
  --up:#4ADE80; --down:#FB7185;
  --hero-bg:#060B12; --hero-fg:#E6EEF7; --hero-muted:#8FA3B8; --hero-hi:#38BDF8;
  --pick1:#F472B6; --pick2:#A3E635; --pick3:#FB923C; --r:14px; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
p,dl,dd,dt{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
:focus-visible{outline:2px solid var(--own);outline-offset:2px}
button{cursor:pointer}

/* 目次 */
.toc{display:flex;gap:8px;flex-wrap:wrap;padding-block:20px 4px}
.toc button{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px 8px 10px;display:inline-flex;align-items:center;gap:10px}
.toc button .num{font-size:15px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;line-height:1}
.toc button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toc button[aria-pressed="true"] .num{background:var(--bg);color:var(--ink)}
body.toc-mode main section{padding-top:32px!important;padding-bottom:56px!important}
.picker button.plain{padding-left:14px}
.controls{display:flex;gap:28px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 指標の見方 */
.more{align-self:flex-start;font:inherit;font-size:13px;font-weight:700;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
:root[data-design="d"] .more{color:var(--accent)}
.lead2{font-size:15px;max-width:44em;margin-bottom:24px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:18px;overflow-x:auto}
.flow h3{font-size:16px;font-weight:700;margin-bottom:4px}
.flow .cap{font-size:13px;color:var(--muted);max-width:46em;margin-bottom:18px}
.flow-in{display:grid;grid-template-columns:auto 28px auto 28px auto 28px auto 28px auto;gap:8px 6px;align-items:center;min-width:660px}
.fn{font-weight:700;text-align:center;border:1px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.fa{text-align:center;color:var(--muted)}
.fm{height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border-radius:6px;background:var(--accent-soft);color:var(--accent);border-bottom:3px solid var(--accent);white-space:nowrap}
.eq{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px;min-width:660px}
.eq>p{font-size:13px;color:var(--muted);margin-bottom:10px}
.eq>p b{color:var(--own)}
.eqrow{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.eqrow>div{background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:8px 14px;display:flex;flex-direction:column;min-width:0}
.eqrow>div.res{border-color:var(--own);background:var(--own-soft)}
.eqrow span{font-size:12px;font-weight:700}
.eqrow small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.eqrow b{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.2}
.eqrow i{font-style:normal;font-size:20px;color:var(--muted)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;margin-bottom:18px;display:flex;flex-direction:column;gap:20px;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mhead h3{font-size:22px;font-weight:900}
.mhead code{font-family:var(--f-disp);font-size:13px;background:var(--accent-soft);padding:2px 10px;border-radius:4px}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mstats div{background:var(--accent-soft);border-radius:calc(var(--r)*.7);padding:10px 14px;min-width:0}
.mstats span{display:block;font-size:12px;color:var(--muted)}
.mstats b{font-family:var(--f-num);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 32px}
.mgrid>div{min-width:0}
.mgrid h4{font-size:14px;font-weight:700;margin:0 0 8px;border-top:2px solid var(--ink);padding-top:10px}
.mgrid p,.mgrid li{font-size:14px;line-height:1.75}
.mgrid ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.ptable{min-width:700px}
.ptable td{vertical-align:top;font-size:14px}
.ptable td:first-child{font-weight:700;min-width:210px}
.ptable tr.hit td{background:var(--own-soft)}
.ptag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--surface);background:var(--own);border-radius:999px;padding:1px 10px}
.howto{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 32px}
.howto>div{border-top:2px solid var(--ink);padding-top:10px;min-width:0}
.howto h4{font-size:14px;font-weight:700;margin:0 0 4px}
.howto p{font-size:13px;color:var(--muted);line-height:1.75}
.sub2{font-size:18px;font-weight:900;margin:36px 0 14px}
@media (max-width:760px){.mgrid,.howto{grid-template-columns:1fr}}
@media (max-width:420px){.mcard{padding:20px 16px}.flow{padding:18px 14px}}

/* 文字クリックで色が変わる */
[data-c="1"]{color:var(--pick1)!important}
[data-c="2"]{color:var(--pick2)!important}
[data-c="3"]{color:var(--pick3)!important}
.hero,main{cursor:pointer}
main input,main select,main textarea,.hero button,main button{cursor:auto}
main button{cursor:pointer}
.tip{max-width:36em}

/* コメント */
.cm{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:12px;min-width:0;max-width:100%}
body.cm-off .cm{display:none}
.cbtn{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:8px}
.cbtn:hover,.cbtn[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.cnt{font-family:var(--f-num);font-size:13px;line-height:1;min-width:20px;height:20px;border-radius:10px;background:var(--own);color:var(--surface);display:inline-grid;place-items:center;padding-inline:5px}
.cnt:empty{display:none}
.cpop{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--ink);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);animation:pop .3s cubic-bezier(.3,1.5,.5,1) both;transform-origin:top left}
.cpop textarea{font:inherit;font-size:14px;width:100%;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:calc(var(--r)*.6);background:var(--bg);color:var(--ink)}
.cacts{display:flex;gap:8px}
.cacts button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:6px 16px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.cacts .cadd{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.cbubbles{display:flex;flex-wrap:wrap;gap:8px;min-width:0;max-width:100%}
.bubble{display:inline-flex;align-items:flex-start;gap:8px;max-width:100%;background:var(--own-soft);color:var(--ink);border:1px solid var(--own);border-radius:16px 16px 16px 4px;padding:6px 8px 6px 14px;font-size:13px;line-height:1.5;transform-origin:left bottom}
.bubble span{min-width:0;overflow-wrap:anywhere}
.bubble button{font:inherit;line-height:1;border:0;background:transparent;color:var(--muted);padding:2px 4px;border-radius:50%}
.bubble button:hover{color:var(--down)}
.bubble.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble.pop,.cpop{animation:none}}

.sample{background:var(--own-soft);color:var(--ink);font-size:13px;font-weight:500}
.sample .wrap{padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sample b{background:var(--own);color:#fff;border-radius:4px;padding:1px 8px;font-size:12px}
:root[data-design="d"] .sample b{color:#1d1404}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg)}
.hero .wrap{padding-block:28px 40px;display:flex;flex-direction:column;gap:28px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hero .eyebrow{color:var(--hero-muted)}
.picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--hero-muted)}
.picker button,.tool-btn{font:inherit;font-size:13px;font-weight:700;color:var(--hero-fg);background:transparent;border:1px solid color-mix(in srgb,var(--hero-fg) 30%,transparent);border-radius:999px;padding:6px 14px 6px 8px;display:inline-flex;align-items:center;gap:8px}
.picker button[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero-bg);border-color:var(--hero-fg)}
.picker .sw{display:inline-flex}
.picker .sw i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.5);margin-left:-3px}
.picker .sw i:first-child{margin-left:0}
.tool-btn{padding:6px 14px}
.hero-main{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end}
.hero h1{font-size:clamp(28px,4.2vw,46px);font-weight:900;letter-spacing:.01em;margin-top:12px}
.hero h1 em{font-style:normal;color:var(--hero-hi)}
.hero p.lead{color:var(--hero-muted);margin-top:14px;max-width:36em}
.meta{display:flex;gap:26px;flex-wrap:wrap;justify-content:flex-end}
.meta div{display:flex;flex-direction:column}
.meta span{font-size:12px;color:var(--hero-muted);letter-spacing:.06em}
.meta strong{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.1}
.tip{font-size:12px;color:var(--hero-muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tip .dots{display:inline-flex;gap:4px}
.tip .dots i{width:10px;height:10px;border-radius:50%}
.tip .dots i:nth-child(1){background:var(--pick1)}.tip .dots i:nth-child(2){background:var(--pick2)}.tip .dots i:nth-child(3){background:var(--pick3)}

section{padding-block:56px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-size:clamp(22px,3vw,30px);font-weight:900;margin-top:6px}
.sec-head p{color:var(--muted);max-width:32em;font-size:14px}

/* input */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;grid-template-columns:.8fr 1.2fr;gap:36px}
.entry>div{min-width:0}
.entry h3{font-size:15px;font-weight:700;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field small{display:block;color:var(--muted);font-size:11px;font-weight:400;line-height:1.4}
input[type=text],input[type=number],select{font:inherit;font-size:15px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:calc(var(--r)*.7);background:var(--bg);color:var(--ink)}
input[type=number]{font-family:var(--f-num);font-size:20px;font-weight:600;padding:6px 12px}
.inp{display:flex;align-items:center;gap:8px}
.inp span{font-size:13px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.entry-note{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}

/* result */
.verdict{font-size:clamp(17px,2.2vw,22px);font-weight:700;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--own);border-radius:var(--r);padding:18px 22px;margin-bottom:20px}
.ref-line{font-size:13px;color:var(--muted);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpi header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi h3{font-size:16px;font-weight:700}
.kpi .formula{font-size:12px;color:var(--muted)}
.ownline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.who{font-size:13px;font-weight:700;color:var(--own)}
.big{font-family:var(--f-num);font-size:64px;font-weight:700;line-height:1;color:var(--own)}
.big small{font-size:26px;margin-left:2px}
.pill{font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.top{color:var(--up)}.pill.mid{color:var(--muted)}.pill.low{color:var(--down)}
.cmp{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.cmp>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cmp dt{font-size:13px;color:var(--muted);min-width:0}
.cmp dd{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.cmp dd b{font-family:var(--f-num);font-size:22px;font-weight:600}
.delta{font-size:13px;font-weight:700;font-family:var(--f-num);min-width:64px;text-align:right}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.range{margin-top:4px}
.track{height:10px;border-radius:5px;background:var(--line);position:relative}
.iqr{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.3;border-radius:5px}
.pin{position:absolute;transform:translateX(-50%)}
.pin.avg{top:-5px;width:3px;height:20px;background:var(--accent);border-radius:2px}
.pin.own{top:-7px;width:5px;height:24px;background:var(--own);border-radius:2px}
.pin.cnd{top:-1px;width:12px;height:12px;border:2px solid var(--accent);background:var(--surface);border-radius:50%}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;gap:8px}
.per,.gap{font-size:13px;color:var(--muted)}
.gap{color:var(--ink);font-weight:500}
.legend{font-size:12px;color:var(--muted);margin-top:14px;display:flex;gap:18px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block}
.lg-own{width:5px;height:14px;background:var(--own);border-radius:2px}
.lg-avg{width:3px;height:14px;background:var(--accent);border-radius:2px}
.lg-cnd{width:10px;height:10px;border:2px solid var(--accent);border-radius:50%}
.lg-iqr{width:18px;height:8px;background:var(--accent);opacity:.3;border-radius:4px}

/* funnel compare */
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;margin-top:20px}
.fcard h3{font-size:16px;font-weight:700}
.fcard .sub{font-size:12px;color:var(--muted);margin:2px 0 18px}
.frow{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;padding-block:8px}
.frow+.frow{border-top:1px dashed var(--line)}
.flab{font-size:14px;font-weight:700}
.fbars{display:flex;flex-direction:column;gap:5px;min-width:0}
.fb{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center}
.fb .t{height:14px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.fb .t i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .35s}
.fb.own .t i{background:var(--own)}.fb.avg .t i{background:var(--accent)}
.fb b{font-family:var(--f-num);font-size:18px;font-weight:600;text-align:right}
.fb.own b{color:var(--own)}
@media (prefers-reduced-motion:reduce){.fb .t i{transition:none}}

/* segment table */
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.tabs button,.sort button{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:999px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sort{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sort button{font-size:13px;padding:6px 12px;border:1px solid var(--line)}
.sort button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:740px}
th,td{padding:13px 18px;text-align:left;vertical-align:middle}
thead th{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr+tr td,tbody+tbody tr:first-child td{border-top:1px solid var(--line)}
tr.me td{background:var(--own-soft)}
tr.avg td{background:var(--accent-soft)}
td.seg{font-weight:700;white-space:nowrap}
td.seg small{display:block;font-weight:400;color:var(--muted);font-size:12px}
tr.me td.seg{color:var(--own)}
.cell{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;min-width:170px}
.cell .v{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.bar.own i{background:var(--own)}
.bar u{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);opacity:.5}
td.last{text-align:right;font-family:var(--f-num);font-size:22px;font-weight:600}
.tlegend{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.tlegend span::before{content:"";display:inline-block;width:2px;height:12px;background:var(--ink);opacity:.5;margin-right:6px;vertical-align:-1px}

/* defs */
.defs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.def{border-top:2px solid var(--ink);padding-top:14px;min-width:0}
.def h3{font-size:15px;font-weight:700}
.def code{font-family:var(--f-disp);font-size:13px;background:var(--accent-soft);padding:2px 8px;border-radius:4px;display:inline-block;margin:6px 0}
.def p{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .hero-main{grid-template-columns:1fr;gap:24px}.meta{justify-content:flex-start}
  .entry{grid-template-columns:1fr;gap:28px;padding:22px}
  .kpis,.defs{grid-template-columns:1fr}
}
@media (max-width:420px){.big{font-size:54px}.frow{grid-template-columns:78px 1fr}.fb{grid-template-columns:1fr 54px}.fcard{padding:20px 16px}}

/* 条件の選択 */
.cond{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;display:flex;flex-direction:column;gap:22px}
.cgroup h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cgroup h3 small{font-weight:400;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 16px}
.chip small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.condbar{display:flex;gap:24px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:18px}
.callsbox{flex:1 1 280px;min-width:0}
.callsrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.callsrow label{font-size:13px;font-weight:700}
.callsrow output{font-family:var(--f-num);font-size:26px;font-weight:700}
.callsbox small{display:block;color:var(--muted);font-size:11px}
input[type=range]{width:100%;accent-color:var(--accent)}
.clear{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:999px;padding:7px 18px}
tr.sel td{background:var(--own-soft)}
tr.sel td.seg{color:var(--own)}
#tb-seg tr[data-i]{cursor:pointer}
#tb-seg tr[data-i]:hover td{background:var(--accent-soft)}
#tb-seg tr.sel:hover td{background:var(--own-soft)}
.stable{min-width:680px}
.stable td{vertical-align:top}
.stable td.ax{font-weight:700;white-space:nowrap}
.stable b{font-family:var(--f-num);font-size:20px;font-weight:600;display:block}
.stable small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.stable .gp{color:var(--own);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.blk-title{font-size:18px;font-weight:900;margin:0 0 6px}
.blk-sub{font-size:13px;color:var(--muted);margin:0 0 14px;max-width:46em}
</style>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c)));}
function mount(h){const app=document.getElementById("app");app.innerHTML=h;
 app.querySelectorAll("script").forEach(o=>{const s=document.createElement("script");s.textContent=o.textContent;o.replaceWith(s)});
 document.getElementById("gate").remove();document.getElementById("gate-style").remove();document.body.classList.remove("gate-body");
 if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}}
async function tryPw(pw,quiet){const btn=document.getElementById("go"),err=document.getElementById("err");btn.disabled=true;err.textContent=quiet?"":"確認しています…";
 try{const h=await unlock(pw);try{if(document.getElementById("rm").checked)sessionStorage.setItem(SK,pw)}catch(_){}mount(h)}
 catch(_){err.textContent=quiet?"":"パスワードが違います。もう一度入力してください。";btn.disabled=false;try{sessionStorage.removeItem(SK)}catch(_){}}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("pw").value,false)});
try{const v=sessionStorage.getItem(SK);if(v)tryPw(v,true)}catch(_){}
</script>
